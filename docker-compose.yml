# Local dependencies only. The application itself runs on the host during
# development (DEVELOPMENT.md §3); production compose is a separate file.
services:
  postgres:
    image: postgres:16
    container_name: scout-postgres
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout}
      POSTGRES_DB: scout
      # pg_trgm ships with the contrib modules in this image; the extension is
      # created by migration 0001, not here.
    command:
      - postgres
      - -c
      - max_connections=40
    ports:
      - "5432:5432"
    volumes:
      - scout-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: scout-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - scout-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  scout-pgdata:
  scout-redisdata:
