[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scout-careers"
version = "0.1.0"
description = "Scout Careers — personal job-search agent (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx[http2]>=0.27",
  "redis>=5",
  "structlog>=24.4",
  "selectolax>=0.3.21",
  "python-ulid>=2.7",
  "apscheduler>=3.10,<4",
  "typer>=0.12",
  "pyyaml>=6.0",
  # APScheduler's SQLAlchemy job store is synchronous and cannot speak asyncpg,
  # so the Postgres job store needs a blocking driver alongside the async one.
  # Two engines, one database (SDD.md §6.2).
  "psycopg[binary]>=3.2",
  # Gmail: the desktop OAuth flow, and the read-only API client.
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.140",
  # Fernet, for the OAuth token at rest. There is no plaintext fallback.
  "cryptography>=43",
  # Bedrock. Imported by llm/bedrock.py and nowhere else in the package.
  "boto3>=1.35",
]

[project.scripts]
scout-careers = "scout_careers.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-PyYAML>=6.0",
  "boto3-stubs[bedrock-runtime]>=1.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scout_careers"]
# Prompts are data files inside the package, not Python. Without this they are
# absent from an installed copy and the registry loads nothing — which fails as
# "no prompts for family ..." at 08:00 rather than at build time.
artifacts = ["src/scout_careers/llm/prompts/**/*.md", "src/scout_careers/llm/prompts/*.lock"]

# ---------------------------------------------------------------------------
# ruff — format and lint. One tool: no black, no isort, no flake8.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "S",             # bandit
  "A",             # builtin shadowing
  "C4",            # comprehensions
  "DTZ",           # naive datetimes        (load-bearing, DEVELOPMENT.md §4.1)
  "T20",           # print / pprint         (load-bearing)
  "ASYNC",         # blocking calls in async
  # A parameter that is accepted, documented, and then never used is a
  # feature that silently does nothing. `run discovery --force` shipped
  # exactly that: the flag reached `run_discovery`, was described in its
  # docstring, and was never forwarded to the query it was meant to
  # change. mypy does not catch it; this does.
  "ARG",           # unused arguments
  "SIM", "RUF",
]
ignore = [
  "E501",   # the formatter owns line length
  # SOURCE_ADAPTERS.md names these exceptions: DeniedByPolicy, RateLimitTimeout,
  # CircuitOpen, RobotsDenied. The names are part of a documented contract, so
  # the "must end in Error" convention loses to matching the specification.
  "N818",
]

# Prose uses real en/em dashes and the source data carries non-breaking spaces
# on purpose; normalisation is exactly what this codebase is testing.
allowed-confusables = ["\u2013", "\u2014", "\u2019", "\u00a0"]

[tool.ruff.lint.per-file-ignores]
# ARG: a fake/stub deliberately accepts the real signature and ignores most
# of it — that is what makes it a substitute. The rule earns its keep in
# src/, where an ignored parameter is a feature that does nothing.
"tests/*" = ["S101", "S105", "S106", "RUF001", "RUF002", "ARG"]
"migrations/*" = ["E402", "F401", "N999"]    # alembic's generated shape
"migrations/versions/*" = ["INP001"]
# T201: dev tooling run by hand at a terminal, where printing IS the output.
# The rule earns its keep in src/, where a `print` is a log line that never
# reaches the log — and that is enforced separately by the "no print statements"
# invariant in `ci/run-checks.sh`, which scans src/ only. Scripts here stay
# linted and type-checked in every other respect, which is the reason they are
# real `.py` files rather than another shell heredoc: a heredoc is invisible to
# both, and this one parses the operator's own resumes.
# INP001: a script directory is not a package and must not grow an __init__.
"scripts/*" = ["T201", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["scout_careers"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false      # fixtures stay readable

[[tool.mypy.overrides]]
module = [
  "selectolax.*",
  "apscheduler.*",
  "docx.*",
  # Google ships no stubs for any of these. Named individually rather than as a
  # blanket `google.*`: google-auth's own typing is partial and improving, and a
  # blanket rule would silently swallow it when it lands.
  "google.auth.*",
  "google.oauth2.*",
  "google_auth_oauthlib.*",
  "googleapiclient.*",
]
ignore_missing_imports = true      # named, not blanket

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:scout_careers.*"]
markers = [
  # Skipped unless DATABASE_URL names a reachable Postgres. The pre-merge gate
  # runs tests/unit only, so an integration test can never become a check that
  # passes because it silently did not run.
  "integration: requires a live Postgres",
]

[tool.coverage.run]
branch = true
source = ["src/scout_careers"]

# ---------------------------------------------------------------------------
# import-linter — the layering rule (DEVELOPMENT.md §2.1)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "scout_careers"

[[tool.importlinter.contracts]]
name = "sources/ never touches the database"
type = "forbidden"
source_modules = ["scout_careers.sources"]
forbidden_modules = ["scout_careers.db"]

[[tool.importlinter.contracts]]
name = "common/ imports nothing from the package"
type = "forbidden"
source_modules = ["scout_careers.common"]
forbidden_modules = ["scout_careers.db", "scout_careers.sources"]

# sources/ owns the MailReader protocol it needs and imports no transport.
# ingest/ is the only place the two meet, and it meets them by injection
# (SOURCE_ADAPTERS.md §7). Without this contract the layering is a convention,
# and a convention is one convenient import away from not being true.
[[tool.importlinter.contracts]]
name = "sources/ never imports the mail transport"
type = "forbidden"
source_modules = ["scout_careers.sources"]
forbidden_modules = ["scout_careers.mail", "scout_careers.scheduler", "scout_careers.ingest"]

# mail/ is a transport. It reads sources/base.py for the DTO and the protocol
# and knows nothing about persistence or scheduling.
[[tool.importlinter.contracts]]
name = "mail/ never touches the database or the scheduler"
type = "forbidden"
source_modules = ["scout_careers.mail"]
forbidden_modules = ["scout_careers.db", "scout_careers.ingest", "scout_careers.scheduler"]

# llm/ is a provider boundary. It may not reach the database or the pipeline:
# a provider module that acquires a session is one that can persist things the
# caller never asked for, and the whole point of the Protocol is that a service
# can reason about what a model call does by reading one signature.
[[tool.importlinter.contracts]]
name = "llm/ never touches the database or the pipeline"
type = "forbidden"
source_modules = ["scout_careers.llm"]
forbidden_modules = ["scout_careers.db", "scout_careers.ingest", "scout_careers.mail", "scout_careers.scheduler", "scout_careers.registry"]

# The controlled vocabulary and the extraction wire schema are the two halves of
# the extraction stage that make its judgements reproducible, and both have to
# stay loadable on their own: by a test with no database, by the eval harness,
# by an audit script that only wants to ask what a phrase resolves to. Only
# extract/service.py — the piece that calls and writes — may reach further.
# The scoring arithmetic is testable without a database only because it never
# touches one. `scoring.service` is the single module allowed to, and keeping
# that boundary is what makes MATCH_SCORING.md §9 and §10 reproducible in CI
# rather than a spreadsheet nobody re-runs.
[[tool.importlinter.contracts]]
name = "the scoring arithmetic stays pure"
type = "forbidden"
source_modules = ["scout_careers.scoring.coverage", "scout_careers.scoring.composite", "scout_careers.scoring.gaps", "scout_careers.scoring.adjacency"]
forbidden_modules = ["scout_careers.db", "scout_careers.llm", "scout_careers.sources", "scout_careers.ingest", "scout_careers.mail", "scout_careers.cli"]

[[tool.importlinter.contracts]]
name = "the skill vocabulary and extraction schema stay pure"
type = "forbidden"
source_modules = ["scout_careers.extract.vocabulary", "scout_careers.extract.schema"]
forbidden_modules = ["scout_careers.db", "scout_careers.llm", "scout_careers.sources", "scout_careers.ingest", "scout_careers.mail"]
