  # Added in vocab.2026-09-07.2, from the intersection of what the six resume
  # variants claim and what an ordinary backend posting asks for. Skills the
  # operator has that nothing in the corpus demands were deliberately left out —
  # Bhashini, DPDP, RACI, ISO 27001. A token neither side uses makes the
  # vocabulary look complete while matching nothing, and an unmatched phrase
  # stays visible in `seed variants` and the requirements audit either way.
  - token: orm
    label: ORM and schema migrations
    family: backend
    aliases:
      ["orm", "sqlalchemy", "sqlalchemy 2.0", "sqlalchemy 2.0 (async)", "alembic", "prisma",
       "alembic / prisma migrations", "django orm", "typeorm", "sequelize", "hibernate",
