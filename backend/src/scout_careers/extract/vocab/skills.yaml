# The controlled skill vocabulary.
#
# `requirement.normalised_skill` and `resume_variant.skill_set` both hold tokens
# from this file, which is what makes coverage a set operation rather than a
# language problem.
#
# A model may not add to it. That is the whole point of it being controlled: a
# phrase the resolver cannot place becomes a `skill_proposal` for the operator to
# review, and new tokens arrive through a reviewed commit. "Why did `Strong
# C/C++ skills` become `cpp`?" then has a one-line answer that points at a file.
#
# Versioned. `version` below is concatenated into `requirement.prompt_version`,
# so changing this file invalidates and re-triggers extraction exactly like a
# prompt change — otherwise a re-mapped phrase silently re-ranks every posting.
#
# Scope: this is a starting vocabulary, not a complete one. It covers what the
# live corpus and this operator's profile actually contain. It grows through
# proposals rather than by guessing at breadth up front — an alias nobody ever
# hits is indistinguishable from one that is wrong.

version: vocab.2026-09-07.2

