# The claims ledger.
#
# Nothing may be asserted in a generated document unless it resolves to a row
# here — and scoring depends on it before any document exists: MATCH_SCORING.md
# §4.2 refuses to let a *quantified* résumé bullet prove a requirement unless it
# cites claims. That is the interlock the whole system is built on. Letting this
# file rot lowers the operator's own match scores.
#
# ─────────────────────────────────────────────────────────────────────────────
# EVERY ROW BELOW IS A DRAFT. It was read off the résumé bullets, not verified.
#
# Set `verdict` on each one:
#
#   verdict: yes   →  approved. Seeded, and usable as proof by scoring and by
#                     any generated document.
#   verdict: no    →  rejected. Not seeded at all. This is the DEFAULT, so a row
#                     nobody has looked at is never written — the ledger's job is
#                     to refuse what it cannot vouch for, and that only works if
#                     silence means refusal.
#
# The question while reviewing is not "did I write this?" but:
#
#         if an interviewer asked me to show them, could I?
#
# `evidence_ref` is OPTIONAL and worth adding where it matters. A bare `yes`
# records that you personally vouched for the figure — true today, and no help
# to anyone in a year. A reference records where it can be checked:
#
#   evidence_ref: "psql khelo_prod -c 'select count(*) from document' → 206"
#   evidence_ref: "CI run #412 on main, 2026-09-01"
#   evidence_ref: "https://codeforces.com/profile/<handle>"
#
# Anything supplied has to be a real reference: TODO, TBD, N/A, ?, - and
# anything under ten characters are refused on an approved row.
# ─────────────────────────────────────────────────────────────────────────────
#
# confidentiality:
#   public      — safe in any document sent anywhere.
#   internal    — fine on a résumé, not for publication.
#   restricted  — NEVER emitted into a document sent outside an allow-listed
#                 employer. Ministry cost and budget figures are drafted here.
#                 A restricted claim still earns coverage when scoring, so the
#                 bullet keeps its value; it is only the emission that is gated.
#
# verified_at is the date YOU checked it, not the date it was true.

