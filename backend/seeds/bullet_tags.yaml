# Per-bullet tags: which vocabulary skills a resume line proves, and which
# ledger claims back the numbers in it.
#
# Hand-written on purpose. Deriving them would mean resolving free prose against
# the vocabulary — the job the extractor does on the demand side, and does
# imperfectly. A wrong tag here does not merely mis-rank a posting: it puts an
# unbacked number into a document sent to an employer.
#
# Tags live here and ONLY here. `seeds/variants/*.json` stay a plain
# transcription of the .docx — `scripts/variants-from-docx.py` overwrites them
# wholesale on every resume edit, so a tag written into one would be destroyed
# by an ordinary edit, in silence. `seed variants` merges this file into
# `content` on the way to the database instead.
#
# Keys are bullet IDs, which are positional: `{variant}.exp.{role}.{block}.{n}`
# and `{variant}.proj.{project}.{n}`. Reordering a resume renumbers them, so
# `seed variants` refuses any ID here that names no bullet — otherwise an
# orphaned tag would move its claims onto whichever line inherited the number.
#
# `claims` may cite only APPROVED claims in seeds/claims.yaml. A bullet whose
# numbers rest on rejected claims carries none — under MATCH_SCORING.md §4.2 it
# degrades to `partial` rather than proving a requirement outright. That is the
# honest outcome, and the operator chose it: re-approving a claim with a real
# evidence reference is what upgrades the bullet, not editing this file.

