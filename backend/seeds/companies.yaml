# Scout Careers — seed registry (COMPANY_REGISTRY.md §9)
#
# Loaded by `scout-careers seed companies`. Idempotent on `slug` and on
# (company_id, adapter, config): re-running inserts what is missing and edits
# nothing the operator has since changed.
#
# Scope, deliberately: every row here is a board on one of the three ATSs Phase 1
# can actually fetch — Greenhouse, Lever, Ashby. The employers §9 lists whose
# boards are Workday, SmartRecruiters or bespoke (Adobe, Nvidia, Salesforce,
# Flipkart, Zoho, Zerodha, the govtech non-profits) are deliberately absent:
# seeding a company whose adapter does not exist yet creates a source that fails
# every night, which is the opposite of a useful registry. They are added by the
# phase that ships their adapter, or by hand with no source at all — a company
# with zero sources is a fully valid registry row (§2.5c).
#
# No row is on a NEVER_FETCH_HOSTS host, and none can be: those hosts have no
# adapter, and `assert_fetch_allowed` would refuse them anyway.
#
# `tier` is the operator's judgement about where scarce attention goes, so it is
# marked honestly: a handful of `dream`, more `strong`, the rest `volume`. A
# registry where everything is `dream` carries no information (§3.1).
#
# The board identifiers are what the employer publishes today. Boards move. The
# first discovery run records the truth in `source.last_status`, and a token that
# has moved shows up as `http_error` / `adapter.board_not_found` in
# `scout-careers runs show` rather than as silence.

companies:
